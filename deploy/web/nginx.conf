# COBLink web container: the static Angular build plus a reverse proxy to the API.
# Installed as /etc/nginx/conf.d/default.conf, so it is read inside the http {} block of the stock nginx.conf.
# "api" is the service name of the API container (docker compose network); it listens on 8080.

upstream coblink_api {
    server api:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml font/ttf application/vnd.ms-fontobject;

    # Shared by all proxied locations below (inherited because the locations set no proxy_set_header of their own).
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
    # Demo / development identity picked in the persona switcher; the API ignores it in Windows-authenticated environments.
    proxy_set_header X-CobLink-User    $http_x_coblink_user;

    # "^~" keeps the regex locations further down away from these prefixes (Swagger UI serves .js and .css files).
    location ^~ /api/ {
        proxy_pass http://coblink_api;
    }

    location ^~ /swagger {
        proxy_pass http://coblink_api;
    }

    location ^~ /health {
        proxy_pass http://coblink_api;
    }

    # Build output with a content hash in its name (main.<16 hex>.js, styles.<16 hex>.css, fonts) never changes.
    location ~ "^/[^/]+\.[0-9a-f]{16}\.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Other files (favicon, licenses) are revalidated. A missing file is a real 404, not index.html:
    # a lazy chunk of an older build must fail loudly after a deployment instead of "loading" HTML as JavaScript.
    location ~* \.(?:js|css|map|svg|png|jpe?g|gif|webp|ico|woff2?|ttf|eot|txt|json)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # index.html and every client-side route (/activities/5/edit, ...): never cached, so a new deployment is picked up at once.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
