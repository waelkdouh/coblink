<a class="visually-hidden-focusable btn btn-light position-absolute m-2" href="/" (click)="skipToContent($event)">Skip to main content</a>

<app-navbar></app-navbar>

<main id="main-content" class="container-fluid py-4 flex-grow-1" tabindex="-1">
  <div *ngIf="startupError$ | async as error" class="alert alert-danger d-flex flex-wrap align-items-center justify-content-between gap-2" role="alert" data-startup-error>
    <div>
      <p class="fw-semibold mb-0">COBLink could not be started</p>
      <p class="mb-0">{{ error.message }}</p>
    </div>
    <button type="button" class="btn btn-outline-danger btn-sm" (click)="retry()">Try again</button>
  </div>

  <router-outlet></router-outlet>
</main>

<app-footer></app-footer>
<app-toast-container></app-toast-container>
