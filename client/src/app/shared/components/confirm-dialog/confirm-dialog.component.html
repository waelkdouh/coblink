<app-modal [title]="title" [dismissible]="!busy" (closed)="cancelled.emit()">
  <p *ngIf="message" class="mb-2">{{ message }}</p>
  <ng-content></ng-content>
  <div *ngIf="error" class="alert alert-danger mt-3 mb-0" role="alert" data-dialog-error>{{ error.message }}</div>

  <button type="button" appModalFooter class="btn btn-outline-secondary" data-dialog-dismiss [disabled]="busy" (click)="cancelled.emit()">
    {{ dismissLabel }}
  </button>
  <button
    type="button"
    appModalFooter
    class="btn"
    data-dialog-confirm
    [ngClass]="confirmClass"
    [disabled]="busy"
    (click)="confirmed.emit()"
  >
    <span *ngIf="busy" class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span>{{ confirmLabel }}
  </button>
</app-modal>
