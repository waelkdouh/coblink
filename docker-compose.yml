name: coblink

# Demo stack: SQL Server + API (Demo environment, header-based demo identity) + Angular app behind nginx.
#   cp .env.example .env     (then choose the SA password)
#   docker compose up --build
#   open http://localhost:8080
# Not for production: Demo mode trusts the X-CobLink-User header, and the database is seeded with fictional data.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Copy .env.example to .env and set MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: src/CobLink.Api/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Demo
      ConnectionStrings__CobLink: Server=sqlserver,1433;Database=CobLink;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      Database__AutoDeploy: "true"
      Database__SeedSampleData: "true"
    ports:
      - "5080:8080" # direct API access and Swagger: http://localhost:5080/swagger

  web:
    build:
      context: .
      dockerfile: deploy/web/Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  sqldata:
